<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/noesia-web/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NoesIA: estudia con Nus hasta el examen.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NoesIA">
  <meta name="theme-color" content="#16112E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>NoesIA</title>
  <!-- Pantalla de carga (parte 11): Nus flota mientras se descarga la app.
       Con «reducir movimiento», quieto. Se quita con el primer fotograma. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #16112E; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #16112E; color: #C9C3E6; transition: opacity 150ms ease-out;
    }
    #carga .nus { width: 132px; height: 132px; animation: flotar 2.4s ease-in-out infinite; }
    #carga .nombre { height: 34px; }
    #carga p { margin: 0; font-size: 15px; font-weight: 700; }
    #carga .sobre { max-width: 320px; text-align: center; font-size: 13px; font-weight: 500; line-height: 1.5; color: #C9C3E6; }
    #carga nav { font-size: 13px; }
    #carga nav a { color: #B9A8FF; font-weight: 700; text-decoration: none; padding: 12px 6px; display: inline-block; }
    #carga .puntos span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%;
      background: #B9A8FF; animation: punto 0.9s ease-in-out infinite; }
    #carga .puntos span:nth-child(2) { animation-delay: 0.15s; }
    #carga .puntos span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes punto { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      #carga .nus, #carga .puntos span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-live="polite">
    <img class="nus" src="nus.svg" alt="">
    <img class="nombre" src="nombre.svg" alt="NoesIA">
    <div class="puntos" aria-hidden="true"><span></span><span></span><span></span></div>
    <p>Nus está preparando tu estudio…</p>
    <!-- Lo que leen Google y los buscadores (y quien espera a que cargue). -->
    <p class="sobre">NoesIA es una app de estudio para alumnos de ESO y Bachillerato en España: te organiza el estudio hasta el examen, te lo explica, te pregunta, te ayuda con los deberes sin darte la solución y te deja estudiar con tu clase.</p>
    <nav><a href="privacidad/">Privacidad</a> · <a href="terminos/">Términos de uso</a> · <a href="mailto:noesia.ia.app@gmail.com">Contacto</a></nav>
  </div>
  <noscript><p style="color:#fff;text-align:center">NoesIA necesita JavaScript para funcionar.</p></noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (!c) return;
      c.style.opacity = '0';
      setTimeout(function () { c.remove(); }, 160);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
